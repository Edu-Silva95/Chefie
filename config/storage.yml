test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= ENV.fetch("RAILS_STORAGE_PATH", Rails.root.join("storage")).to_s %>

# Cloudflare Storage R2 configuration.
r2:
  service: S3
  endpoint: https://<%= ENV["R2_ACCOUNT_ID"] %>.r2.cloudflarestorage.com
  access_key_id: <%= ENV["R2_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["R2_SECRET_ACCESS_KEY"] %>
  region: auto
  bucket: chefie
  force_path_style: true
  # Cloudflare R2 rejects AWS SDK's newer checksum headers when combined with
  # ActiveStorage's MD5 integrity header.
  compute_checksums: false
  request_checksum_calculation: never
  response_checksum_validation: never
# Remember not to checkin your GCS keyfile to a repository
# google:
#   service: GCS
#   project: your_project
#   credentials: <%= Rails.root.join("path/to/gcs.keyfile") %>
